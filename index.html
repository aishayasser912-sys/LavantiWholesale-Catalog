    position: relative;
    overflow: hidden;
  }

  .page {
    display: none;
    width: 100%;
    height: 100%;

    position: relative;
  }

  .page.active {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* ---------- Cover page ---------- */
  .cover-page {
    display: none;
    width: 100%;
    height: 100%;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    position: relative;
  }

  .cover-page.active { display: flex; }

  .cover-logo {
    font-size: 22px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 20px;
  }

  .cover-title {
    font-size: 56px;
    font-weight: bold;
    color: #222;
    margin-bottom: 14px;
  }

  .cover-subtitle {
    font-size: 20px;
    color: #666;
    margin-bottom: 30px;
  }

  .cover-image {
    width: 620px;
    height: 1300px;
    object-fit: cover;
    object-position: top;
    border-radius: 8px;
    background: #eee;
  }

  /* ---------- Product page ---------- */
  .collection-label {
    text-align: center;
    font-size: 18px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 6px;
  }

  .product-name {
    text-align: center;
    font-size: 40px;
    font-weight: bold;
    color: #222;
    margin-bottom: 8px;
  }

  .size-label {
    text-align: center;
    font-size: 18px;
    color: #a05a2c;
    font-weight: bold;
    margin-bottom: 26px;
  }

  .colors-heading {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    color: #333;
    margin-bottom: 16px;
  }

  .swatch-row {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 8px;
  }

  .swatch {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    cursor: pointer;
    border: 3px solid transparent;
    padding: 0;
  }

  .swatch.selected { border-color: #222; }

  .sku-code {
    text-align: center;
    font-size: 16px;
    color: #a05a2c;
    font-weight: bold;
    margin-bottom: 6px;
  }

  .color-name {
    text-align: center;
    font-size: 15px;
    color: #666;
    margin-bottom: 26px;
  }

  .hero-image {
    display: block;
    width: 100%;
    height: 560px;
    object-fit: cover;
    border-radius: 8px;
    background: #eee;
    margin-bottom: 20px;
  }

  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-top: 20px;
  }

  .price-tag {
    background: #f7f4ee;
    border-radius: 6px;
    padding: 20px 24px;
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    color: #b0301f;
  }

  .details { text-align: right; }

  .details h3 {
    font-size: 16px;
    color: #333;
    margin-bottom: 8px;
  }

  .details p {
    font-size: 15px;
    color: #555;
    line-height: 1.5;

  /* ---------- Navigation ---------- */
  .nav-bar {
    position: absolute;
    bottom: 30px;
    left: 50px;
    right: 50px;
    display: flex;
    align-items: center;
    justify-content: space-between;

  .nav-btn {
    background: #222;
    color: #ffffff;
    border: none;
    padding: 12px 24px;
    border-radius: 6px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
  }

  .nav-btn:disabled { background: #ccc; cursor: default; }

  .page-counter {
    font-size: 14px;
    color: #888;
  }

          { name: "Firewood Black", sku: "V06-FBK-42", price: 899, image: "placeholder.jpg" },
          { name: "Firewood Oak",   sku: "V06-FOK-42", price: 899, image: "placeholder.jpg" }
        ]},
        { label: "48\" Vanity", colors: [
          { name: "Firewood Black", sku: "V06-FBK-48", price: 989, image: "placeholder.jpg" },
          { name: "Firewood Oak",   sku: "V06-FOK-48", price: 989, image: "placeholder.jpg" }
        ]},
        { label: "60\" Vanity", colors: [
          { name: "Firewood Black", sku: "V06-FBK-60", price: 1439, image: "placeholder.jpg" },
          { name: "Firewood Oak",   sku: "V06-FOK-60", price: 1439, image: "placeholder.jpg" }
        ]},
        { label: "72\" Vanity", colors: [
          { name: "Firewood Black", sku: "V06-FBK-72", price: 1529, image: "placeholder.jpg" },
          { name: "Firewood Oak",   sku: "V06-FOK-72", price: 1529, image: "placeholder.jpg" }
        ]}
      ]
    }

  ];

  /* ============================================================
     Below this line: page-building logic. No need to edit.
     ============================================================ */

  document.getElementById("cover-logo").textContent = COVER.logo;
  document.getElementById("cover-title").textContent = COVER.title;
  document.getElementById("cover-subtitle").textContent = COVER.subtitle;
  document.getElementById("cover-image").src = COVER.image;

  const productPagesContainer = document.getElementById("product-pages");

  // Flatten collections -> sizes into one linear page list
  const FLAT_PAGES = [];
  COLLECTIONS.forEach(collection => {
    collection.sizes.forEach(size => {
      FLAT_PAGES.push({ collectionName: collection.name, size });
    });
  });

  const totalPages = FLAT_PAGES.length + 1; // +1 for cover
  document.getElementById("cover-counter").textContent = "Page 1 of " + totalPages;

  FLAT_PAGES.forEach((entry, index) => {
    const pageNumber = index + 1;
    const { collectionName, size } = entry;

    const page = document.createElement("div");
    page.className = "page";
    page.dataset.page = pageNumber;

    page.innerHTML = `
      <div class="collection-label">${collectionName}</div>
      <div class="product-name">Bathroom Vanity</div>
      <div class="size-label">${size.label}</div>
      <div class="colors-heading">Available colors</div>
      <div class="swatch-row"></div>
      <div class="sku-code"></div>
      <div class="color-name"></div>
      <img class="hero-image" src="" alt="">
      <div class="info-row">
        <div class="price-tag"></div>
        <div class="details">
          <h3>Collection</h3>
          <p>${collectionName}</p>
        </div>
      </div>
      <div class="nav-bar">
        <button class="nav-btn" onclick="goToPage(${pageNumber - 1})">Prev</button>
        <div class="page-counter">Page ${pageNumber + 1} of ${totalPages}</div>
        <button class="nav-btn" ${pageNumber === totalPages - 1 ? "disabled" : `onclick="goToPage(${pageNumber + 1})"`}>Next</button>
      </div>
    `;

    productPagesContainer.appendChild(page);

    const heroImage = page.querySelector(".hero-image");
    const skuLabel = page.querySelector(".sku-code");
    const colorNameLabel = page.querySelector(".color-name");
    const priceTag = page.querySelector(".price-tag");
    const swatchRow = page.querySelector(".swatch-row");

    // Simple color-name to swatch-color mapping for the circles
    const SWATCH_HEX = {
      "Grey": "#7A7A76", "Navy Blue": "#2C3E5C", "White": "#F4F2ED",
      "Black": "#222222", "Oak": "#C9A57C", "Walnut": "#6B4A34",
      "Firewood Black": "#3B3733", "Firewood Grey": "#6E6A66",
      "Firewood Oak": "#B8926A", "Firewood White": "#EDEAE2",
      "Rosewood Grey": "#8C7A78"
    };

    function selectColor(color, btn) {
      heroImage.src = color.image;
      heroImage.alt = color.name;
      skuLabel.textContent = color.sku;
      colorNameLabel.textContent = color.name;
      priceTag.textContent = "$" + color.price;
      swatchRow.querySelectorAll(".swatch").forEach(s => s.classList.remove("selected"));
      btn.classList.add("selected");
    }

    size.colors.forEach((color, cIndex) => {
      const btn = document.createElement("button");
      btn.className = "swatch" + (cIndex === 0 ? " selected" : "");
      btn.style.background = SWATCH_HEX[color.name] || "#cccccc";
      btn.setAttribute("aria-label", color.name);
      btn.onclick = () => selectColor(color, btn);
      swatchRow.appendChild(btn);
    });

    selectColor(size.colors[0], swatchRow.children[0]);
  });

  function goToPage(pageNumber) {
    document.querySelectorAll(".cover-page, .page").forEach(p => {
      p.classList.toggle("active", Number(p.dataset.page) === pageNumber);
    });
    window.scrollTo(0, 0);
  }
</script>

</body>
</html>
