<!DOCTYPE html><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interactive Product Catalog</title>
<style>
  /* ============================================================
     HOW TO EDIT THIS FILE
     ============================================================
     1. Edit the COVER object to set your cover page title/logo/image.
     2. Edit the PRODUCTS list -- one entry = one page in the catalog.
     3. Use the Next / Prev buttons (bottom of each page) to flip
        through pages when viewing the site.
     4. Upload your image files to the same GitHub folder as this
        file, then just use the filename, e.g. "vanity-gray.jpg"
     ============================================================ */

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #d8d8d4;
    display: flex;
    justify-content: center;
  }

  #canvas {
    width: 1080px;
    height: 1920px;
    background: #ffffff;
    position: relative;
    overflow: hidden;
  }

  .page {
    display: none;
    width: 100%;
    height: 100%;
    padding: 60px 50px 130px;
    position: relative;
  }

  .page.active {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* ---------- Cover page ---------- */
  .cover-page {
    display: none;
    width: 100%;
    height: 100%;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    position: relative;
  }

  .cover-page.active {
    display: flex;
  }

  .cover-logo {
    font-size: 22px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 20px;
  }

  .cover-title {
    font-size: 56px;
    font-weight: bold;
    color: #222;
    margin-bottom: 14px;
  }

  .cover-subtitle {
    font-size: 20px;
    color: #666;
    margin-bottom: 30px;
  }

  .cover-image {
    width: 620px;
    height: 1300px;
    object-fit: cover;
    object-position: top;
    border-radius: 8px;
    background: #eee;
  }

  /* ---------- Product page ---------- */
  .collection-label {
    text-align: center;
    font-size: 18px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 6px;
  }

  .product-name {
    text-align: center;
    font-size: 40px;
    font-weight: bold;
    color: #222;
    margin-bottom: 30px;
  }

  .colors-heading {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    color: #333;
    margin-bottom: 16px;
  }

  .swatch-row {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 8px;
  }

  .swatch {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    cursor: pointer;
    border: 3px solid transparent;
    padding: 0;
  }

  .swatch.selected {
    border-color: #222;
  }

  .sku-code {
    text-align: center;
    font-size: 16px;
    color: #a05a2c;
    font-weight: bold;
    margin-bottom: 30px;
  }

  .hero-image {
    display: block;
    width: 100%;
    height: 560px;
    object-fit: cover;
    border-radius: 8px;
    background: #eee;
    margin-bottom: 20px;
  }

  .thumb-row {
    display: flex;
    gap: 14px;
    margin-bottom: 30px;
  }

  .thumb {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 8px;
    background: #eee;
    border: 1px solid #eee;
  }

  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-top: 20px;
  }

  .price-tag {
    background: #f7f4ee;
    border-radius: 6px;
    padding: 20px 24px;
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    color: #b0301f;
  }

  .details {
    text-align: right;
  }

  .details h3 {
    font-size: 16px;
    color: #333;
    margin-bottom: 8px;
  }

  .details p {
    font-size: 15px;
    color: #555;
    line-height: 1.5;
  }

  /* ---------- Navigation ---------- */
  .nav-bar {
    position: absolute;
    bottom: 30px;
    left: 50px;
    right: 50px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-btn {
    background: #222;
    color: #ffffff;
    border: none;
    padding: 12px 24px;
    border-radius: 6px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
  }

  .nav-btn:disabled {
    background: #ccc;
    cursor: default;
  }

  .page-dots {
    display: flex;
    gap: 8px;
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ccc;
  }

  .dot.active {
    background: #222;
  }
</style>
</head>
<body>

<div id="canvas">

  <!-- Cover page -->
  <div class="cover-page active" data-page="0">
    <div class="cover-logo" id="cover-logo"></div>
    <div class="cover-title" id="cover-title"></div>
    <div class="cover-subtitle" id="cover-subtitle"></div>
    <img class="cover-image" id="cover-image" src="" alt="">
    <div class="nav-bar">
      <div></div>
      <div class="page-dots" id="page-dots"></div>
      <button class="nav-btn" onclick="goToPage(1)">Next</button>
    </div>
  </div>

  <!-- Product pages get inserted here by JS -->
  <div id="product-pages"></div>

</div>

<script>
  /* ============================================================
     COVER PAGE -- edit this
     ============================================================ */
  const COVER = {
    logo: "Lavanti",
    title: "Lavanti",
    subtitle: "Wholesale Catalog",
    image: "Gemini_Generated_Image_mcxy52mcxy52mcxy.jpg"
  };

  /* ============================================================
     PRODUCTS -- one entry = one page. Add as many as you want.
     ============================================================ */
  const PRODUCTS = [
    {
      name: "Bathroom Vanity",
      collection: "Oakford",
      price: "$250",
      dimensions: "W 30\" \u00b7 D 22\" \u00b7 H 35\"",
      thumbnails: [
        "https://placehold.co/200x200/e8e4dc/999?text=Drawer",
        "https://placehold.co/200x200/e8e4dc/999?text=Sink",
        "https://placehold.co/200x200/e8e4dc/999?text=Base"
      ],
      colors: [
        { name: "Grey",  hex: "#6E6A66", sku: "V01-FGY-1830-1", image: "https://placehold.co/900x560/6E6A66/ffffff?text=Grey" },
        { name: "Oak",   hex: "#D8D2C2", sku: "V02-CRM-1830-1", image: "https://placehold.co/900x560/D8D2C2/333333?text=Oak" },
        { name: "Oak E", hex: "#C9A57C", sku: "V03-TAN-1830-1", image: "https://placehold.co/900x560/C9A57C/ffffff?text=Oak+E" },
        { name: "White", hex: "#F4F2ED", sku: "V04-WHT-1830-1", image: "https://placehold.co/900x560/F4F2ED/333333?text=White" }
      ]
    },
    {
      name: "Bathroom Vanity",
      collection: "Lavanti Mira",
      price: "$310",
      dimensions: "W 36\" \u00b7 D 20\" \u00b7 H 22\"",
      thumbnails: [
        "https://placehold.co/200x200/e8e4dc/999?text=Handle",
        "https://placehold.co/200x200/e8e4dc/999?text=Top",
        "https://placehold.co/200x200/e8e4dc/999?text=Mount"
      ],
      colors: [
        { name: "Walnut", hex: "#6B4A34", sku: "M01-WAL-3620-1", image: "https://placehold.co/900x560/6B4A34/ffffff?text=Walnut" },
        { name: "White",  hex: "#EDEDE9", sku: "M02-WHT-3620-1", image: "https://placehold.co/900x560/EDEDE9/333333?text=White" }
      ]
    }
  ];

  /* ============================================================
     Below this line: page-building logic. You don't need to edit
     this unless you want to change how things work.
     ============================================================ */

  document.getElementById("cover-logo").textContent = COVER.logo;
  document.getElementById("cover-title").textContent = COVER.title;
  document.getElementById("cover-subtitle").textContent = COVER.subtitle;
  document.getElementById("cover-image").src = COVER.image;

  const productPagesContainer = document.getElementById("product-pages");
  const totalPages = PRODUCTS.length + 1; // +1 for cover

  PRODUCTS.forEach((product, productIndex) => {
    const pageNumber = productIndex + 1;

    const page = document.createElement("div");
    page.className = "page";
    page.dataset.page = pageNumber;

    page.innerHTML = `
      <div class="collection-label">${product.collection}</div>
      <div class="product-name">${product.name}</div>
      <div class="colors-heading">Available colors</div>
      <div class="swatch-row"></div>
      <div class="sku-code"></div>
      <img class="hero-image" src="" alt="">
      <div class="thumb-row"></div>
      <div class="info-row">
        <div class="price-tag">${product.price}</div>
        <div class="details">
          <h3>Dimensions</h3>
          <p>${product.dimensions}</p>
          <h3 style="margin-top:16px;">Collection</h3>
          <p>${product.collection}</p>
        </div>
      </div>
      <div class="nav-bar">
        <button class="nav-btn" onclick="goToPage(${pageNumber - 1})">Prev</button>
        <div class="page-dots"></div>
        <button class="nav-btn" ${pageNumber === totalPages - 1 ? "disabled" : `onclick="goToPage(${pageNumber + 1})"`}>Next</button>
      </div>
    `;

    productPagesContainer.appendChild(page);

    const heroImage = page.querySelector(".hero-image");
    const skuLabel = page.querySelector(".sku-code");
    const swatchRow = page.querySelector(".swatch-row");
    const thumbRow = page.querySelector(".thumb-row");

    product.thumbnails.forEach(src => {
      const t = document.createElement("img");
      t.className = "thumb";
      t.src = src;
      thumbRow.appendChild(t);
    });

    function selectColor(color, btn) {
      heroImage.src = color.image;
      heroImage.alt = product.name + " - " + color.name;
      skuLabel.textContent = color.sku;
      swatchRow.querySelectorAll(".swatch").forEach(s => s.classList.remove("selected"));
      btn.classList.add("selected");
    }

    product.colors.forEach((color, index) => {
      const btn = document.createElement("button");
      btn.className = "swatch" + (index === 0 ? " selected" : "");
      btn.style.background = color.hex;
      btn.setAttribute("aria-label", color.name);
      btn.onclick = () => selectColor(color, btn);
      swatchRow.appendChild(btn);
    });

    selectColor(product.colors[0], swatchRow.children[0]);
  });

  // Build page dots on every page
  document.querySelectorAll(".page-dots").forEach(dotsContainer => {
    for (let i = 0; i < totalPages; i++) {
      const dot = document.createElement("div");
      dot.className = "dot";
      dotsContainer.appendChild(dot);
    }
  });

  function updateDots(activePage) {
    document.querySelectorAll(".page-dots").forEach(dotsContainer => {
      dotsContainer.querySelectorAll(".dot").forEach((dot, i) => {
        dot.classList.toggle("active", i === activePage);
      });
    });
  }

  function goToPage(pageNumber) {
    document.querySelectorAll(".cover-page, .page").forEach(p => {
      p.classList.toggle("active", Number(p.dataset.page) === pageNumber);
    });
    updateDots(pageNumber);
    window.scrollTo(0, 0);
  }

  updateDots(0);
</script>

</body>
</html>
