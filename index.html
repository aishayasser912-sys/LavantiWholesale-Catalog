<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interactive Product Catalog</title>
<style>
  /* ============================================================
     HOW TO EDIT THIS FILE
     ============================================================
     Scroll down to the PRODUCTS list in the <script> section.
     For each product, fill in:
       - name, collection, price, dimensions
       - hero: the main big image per color
       - thumbnails: the small detail shots (same for all colors,
         unless you want them to change too -- ask if so)
       - colors: each needs a name, hex, sku code, and hero image
     Upload your image files to the same GitHub folder as this
     file, then just use the filename, e.g. "vanity-gray.jpg"
     ============================================================ */

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f4f2;
    display: flex;
    justify-content: center;
  }

  #canvas {
    width: 1080px;
    height: 1920px;
    background: #ffffff;
    padding: 60px 50px;
    position: relative;
    overflow: hidden;
  }

  .collection-label {
    text-align: center;
    font-size: 18px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 6px;
  }

  .product-name {
    text-align: center;
    font-size: 40px;
    font-weight: bold;
    color: #222;
    margin-bottom: 30px;
  }

  .colors-heading {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    color: #333;
    margin-bottom: 16px;
  }

  .swatch-row {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 8px;
  }

  .swatch {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    cursor: pointer;
    border: 3px solid transparent;
    padding: 0;
  }

  .swatch.selected {
    border-color: #222;
  }

  .sku-code {
    text-align: center;
    font-size: 16px;
    color: #a05a2c;
    font-weight: bold;
    margin-bottom: 30px;
  }

  .hero-image {
    display: block;
    width: 100%;
    height: 620px;
    object-fit: cover;
    border-radius: 8px;
    background: #eee;
    margin-bottom: 20px;
  }

  .thumb-row {
    display: flex;
    gap: 14px;
    margin-bottom: 30px;
  }

  .thumb {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 8px;
    background: #eee;
    border: 1px solid #eee;
  }

  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-top: 20px;
  }

  .price-tag {
    background: #f7f4ee;
    border-radius: 6px;
    padding: 20px 24px;
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    color: #b0301f;
  }

  .details {
    text-align: right;
  }

  .details h3 {
    font-size: 16px;
    color: #333;
    margin-bottom: 8px;
  }

  .details p {
    font-size: 15px;
    color: #555;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div id="canvas">
  <div class="collection-label" id="collection-label"></div>
  <div class="product-name" id="product-name"></div>

  <div class="colors-heading">Available colors</div>
  <div class="swatch-row" id="swatch-row"></div>
  <div class="sku-code" id="sku-code"></div>

  <img class="hero-image" id="hero-image" src="" alt="">

  <div class="thumb-row" id="thumb-row"></div>

  <div class="info-row">
    <div class="price-tag" id="price-tag"></div>
    <div class="details">
      <h3>Dimensions</h3>
      <p id="dimensions"></p>
      <h3 style="margin-top:16px;">Collection</h3>
      <p id="collection-name"></p>
    </div>
  </div>
</div>

<script>
  /* ============================================================
     PRODUCTS -- edit everything below
     ============================================================ */

  const PRODUCTS = [
    {
      name: "Bathroom Vanity",
      collection: "Lavanti Depos",
      price: "$250",
      dimensions: "W 30\" \u00b7 D 22\" \u00b7 H 35\"",
      thumbnails: [
        "https://placehold.co/200x200/e8e4dc/999?text=Drawer",
        "https://placehold.co/200x200/e8e4dc/999?text=Sink",
        "https://placehold.co/200x200/e8e4dc/999?text=Base"
      ],
      colors: [
        { name: "Charcoal", hex: "#6E6A66", sku: "V01-FGY-1830-1", image: "https://placehold.co/900x620/6E6A66/ffffff?text=Charcoal" },
        { name: "Cream",    hex: "#D8D2C2", sku: "V02-CRM-1830-1", image: "https://placehold.co/900x620/D8D2C2/333333?text=Cream" },
        { name: "Tan",      hex: "#C9A57C", sku: "V03-TAN-1830-1", image: "https://placehold.co/900x620/C9A57C/ffffff?text=Tan" },
        { name: "Rosewood", hex: "#A9847B", sku: "V04-RSW-1830-1", image: "https://placehold.co/900x620/A9847B/ffffff?text=Rosewood" },
        { name: "Pale Gray", hex: "#CBCDD4", sku: "V05-PGY-1830-1", image: "https://placehold.co/900x620/CBCDD4/333333?text=Pale+Gray" },
        { name: "Slate",    hex: "#8E97A6", sku: "V06-SLT-1830-1", image: "https://placehold.co/900x620/8E97A6/ffffff?text=Slate" },
        { name: "Graphite", hex: "#5B5B5B", sku: "V07-GRP-1830-1", image: "https://placehold.co/900x620/5B5B5B/ffffff?text=Graphite" }
      ]
    }
  ];

  const product = PRODUCTS[0];

  document.getElementById("collection-label").textContent = product.collection;
  document.getElementById("product-name").textContent = product.name;
  document.getElementById("price-tag").textContent = product.price;
  document.getElementById("dimensions").textContent = product.dimensions;
  document.getElementById("collection-name").textContent = product.collection;

  const heroImage = document.getElementById("hero-image");
  const skuLabel = document.getElementById("sku-code");
  const swatchRow = document.getElementById("swatch-row");
  const thumbRow = document.getElementById("thumb-row");

  product.thumbnails.forEach(src => {
    const t = document.createElement("img");
    t.className = "thumb";
    t.src = src;
    thumbRow.appendChild(t);
  });

  function selectColor(color, btn) {
    heroImage.src = color.image;
    heroImage.alt = product.name + " - " + color.name;
    skuLabel.textContent = color.sku;
    swatchRow.querySelectorAll(".swatch").forEach(s => s.classList.remove("selected"));
    btn.classList.add("selected");
  }

  product.colors.forEach((color, index) => {
    const btn = document.createElement("button");
    btn.className = "swatch" + (index === 0 ? " selected" : "");
    btn.style.background = color.hex;
    btn.setAttribute("aria-label", color.name);
    btn.onclick = () => selectColor(color, btn);
    swatchRow.appendChild(btn);
  });

  selectColor(product.colors[0], swatchRow.children[0]);
</script>

</body>
</html>
